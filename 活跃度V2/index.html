<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月度活跃度动态演变</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">
    <header class="page-header">
      <div><h1>月度活跃度指数动态演变 <span id="dateRange">（2023年1月–2026年7月）</span></h1><p class="subtitle">以 2023 年平均月度原始活跃度为基期（=100）</p></div>
      <div class="now"><span class="pulse"></span><strong id="currentMonth">--</strong><small>当前播放月份</small></div>
    </header>

    <section class="panel trend-panel" aria-label="月度趋势">
      <div class="panel-heading"><div><h2>月度总活跃度趋势</h2><p>悬停月份可查看当月五维结构；点击折线节点可跳转播放。</p></div><div id="legend" class="legend"></div></div>
      <div id="chart" role="img" aria-label="月度活跃度折线图"></div>
      <div class="controls">
        <button id="prev" aria-label="上一个月">‹</button><button id="play" aria-label="暂停播放">Ⅱ</button><button id="next" aria-label="下一个月">›</button>
        <input id="timeline" type="range" min="0" max="0" value="0" aria-label="月份时间轴">
        <span id="timelineLabel">--</span>
      </div>
    </section>

    <section class="bottom-grid">
      <article class="panel structure-panel"><div class="section-title"><div><p class="eyebrow">当月结构</p><h2 id="structureMonth">--</h2></div><div class="total"><span>月度总活跃度</span><strong id="totalScore">0</strong></div></div><div id="categoryBars" class="category-bars"></div></article>
      <article class="panel events-panel"><div class="section-title"><div><p class="eyebrow">事件解释</p><h2>本月协同事件</h2></div><span id="eventCount" class="count">0 条</span></div><div class="event-viewport"><div id="eventList" class="event-list"></div></div><p class="event-tip">事件随月份联动；同一事件的多项协同得分合并展示。</p></article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="data/embedded_activity_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
