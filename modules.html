illColor:color,fillOpacity:precise?.82:.32,color:precise?'#ffffff':'#52697c',weight:precise?1.2:1,dashArray:precise?null:'4 3'}).addTo(resourceLeafletMap);marker.bindTooltip(`${n.name}｜${n.region}｜${n.type}`,{direction:'top',offset:[0,-5]});marker.bindPopup(`<div style="min-width:230px"><b>${n.name}</b><br>${n.region} · ${n.type}<br>关联合作事件：${n.events}个<br>坐标质量：${n.quality}</div>`);if(['北京','天津','河北','中央及国家级'].includes(n.region))bounds.push([n.lat,n.lng])});if(bounds.length)resourceLeafletMap.fitBounds(bounds,{padding:[28,28],maxZoom:8});let legend=L.control({position:'bottomleft'});legend.onAdd=()=>{let d=L.DomUtil.create('div');d.style.cssText='background:#fff;color:#17323f;padding:8px 10px;border:1px solid #b8ccd6;border-radius:6px;line-height:1.8;box-shadow:0 2px 10px #17323f22';d.innerHTML='<b>机构坐标</b><br><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#3286da;margin-right:5px"></span>实心：真实地理编码<br><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#9eb0ba;margin-right:5px"></span>半透明：城市级回退';return d};legend.addTo(resourceLeafletMap);setTimeout(()=>resourceLeafletMap.invalidateSize(),120)}function latestList(rows){return `<div class=list>${rows.slice(0,12).map(e=>`<div class=evidence><b>${e.title}</b><div class=muted>${e.date||e.year||'日期待核验'} · ${e.source||'来源待补充'}</div>${e.url?`<a href="${e.url}" target=_blank rel=noopener>查看原文</a>`:''}</div>`).join('')}</div>`}function page(id){let m=D.meta;if(id==='analysis')return `<section class="page active"><div class=title><h1>教育科技人才一体化分析</h1><span class=stamp>真实事件派生统计 · 截止 ${m.latestDate}</span></div><div class=kpis><div class=kpi>协同事件<b>${fmt(m.eventCount)}</b></div><div class=kpi>合作机构<b>${fmt(m.nodeCount)}</b></div><div class=kpi>合作关系<b>${fmt(m.edgeCount)}</b></div><div class=kpi>跨链领域<b>4</b></div></div><div class=grid><article class="card half"><h2>四链相关事件结构</h2>${bars(D.domains)}</article><article class="card half"><h2>区域主体结构</h2>${bars(D.regions)}<
