<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>京津冀教育协同发展监测</title>
  <style>
    :root{--bg:#031426;--panel:rgba(3,27,50,.94);--line:rgba(0,137,255,.65);--grid:rgba(80,130,170,.18);--cyan:#12c8ff;--text:#f2f7ff;--sub:#b8c7d9;--gap:10px}
    *{box-sizing:border-box} html,body{min-width:1200px;min-height:100%;margin:0} body{overflow-x:auto;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
    .dashboard-shell{min-width:1200px;min-height:100vh;padding:14px 20px 22px;background:radial-gradient(circle at 50% 0%,rgba(0,95,190,.12),transparent 38%),linear-gradient(180deg,#031426,#04182b)}
    .dashboard-header{position:relative;display:flex;height:76px;align-items:center;justify-content:center;border-bottom:1px solid var(--grid)}.dashboard-header:after{position:absolute;bottom:-1px;left:50%;width:min(420px,35%);height:2px;content:"";transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
    .dashboard-header__title{text-align:center}.dashboard-header__eyebrow{margin:0 0 4px;color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.15em}.dashboard-header h1{margin:0;font-size:clamp(30px,1.85vw,36px);font-weight:650;letter-spacing:.12em}.dashboard-header__updated{position:absolute;right:0;margin:0;color:var(--sub);font-size:13px}
    .dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:450px 350px 300px;gap:var(--gap);min-width:1160px;margin-top:14px}.dashboard-panel{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:inset 0 0 18px rgba(0,102,204,.08),0 0 10px rgba(0,90,180,.05)}.dashboard-panel:before{position:absolute;z-index:2;top:0;left:18px;width:72px;height:2px;content:"";background:linear-gradient(90deg,var(--cyan),transparent);pointer-events:none}.panel-body{width:100%;height:100%}.panel-header{display:flex;height:52px;align-items:center;justify-content:center;border-bottom:1px solid var(--grid)}.panel-header+.panel-body{height:calc(100% - 52px)}.panel-title{margin:0;font-size:21px;font-weight:600;letter-spacing:.05em}.panel-placeholder{display:grid;width:100%;height:100%;place-content:center;gap:8px;color:var(--sub);font-size:16px;text-align:center;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}.panel-placeholder small{color:#7e94ab;font-size:12px}.panel-more{position:absolute;z-index:5;top:11px;right:14px;padding:5px 10px;border:1px solid rgba(0,168,255,.65);border-radius:4px;color:#bdeaff;font-size:12px;text-decoration:none;background:rgba(3,24,48,.88)}.panel-more:hover{border-color:var(--cyan);color:#fff;background:rgba(8,103,232,.35)}.resource-detail-overlay{position:fixed;z-index:50;inset:0;display:none;padding:18px;background:rgba(1,12,28,.94)}.resource-detail-overlay.is-open{display:block}.resource-detail-overlay__mount{width:100%;height:100%}
    .panel-activity-index{grid-column:1;grid-row:1}.panel-activity-share{grid-column:1;grid-row:2}.panel-important-events{grid-column:1;grid-row:3}.panel-education-index{grid-column:2;grid-row:1}.panel-cooperation-network{grid-column:2;grid-row:2 / 4}.panel-coordination-index{grid-column:3;grid-row:1}.panel-stage-share{grid-column:3;grid-row:2}.panel-resource-overview{grid-column:3;grid-row:3}
    .direct-module{width:100%;height:100%;overflow:hidden;background:#031426}.direct-module__mount{width:100%;height:100%;overflow:hidden}.direct-module .stage-share-panel{width:100%;height:100%}.panel-stage-share .panel-actions{top:9px;transform:none}.dashboard-panel .panel-header{justify-content:flex-start!important;padding-left:16px}.dashboard-panel .panel-title{text-align:left!important}.panel-coordination-index .coordination-preview,.panel-coordination-index .coordination-preview__frame{width:100%!important;height:100%!important;min-height:0!important;padding:0!important;margin:0!important;background:transparent!important}.panel-coordination-index .coordination-preview__frame .dashboard-panel{width:100%!important;height:100%!important}.panel-activity-index .direct-module__mount{display:flex;align-items:center;justify-content:center}.panel-activity-index #active-index-root{width:100%!important;height:100%!important}.panel-activity-index .active-index__header{position:relative;justify-content:flex-start!important;padding-left:16px}.panel-activity-index .active-index__actions{position:absolute;right:16px}.panel-activity-index .active-index__body{padding:10px 12px}.panel-activity-index .active-index__chart-wrap{margin-top:18px}.panel-activity-index .active-index__footer{display:none}.panel-activity-share .panel-hd{justify-content:flex-start!important}.panel-activity-share .panel-title{padding-right:170px;text-align:left!important}.panel-education-index .edu-index__header{justify-content:flex-start!important;padding-left:16px}.direct-module .module-preview,.direct-module .module-preview__frame,.direct-module .frame{width:100%!important;height:100%!important;min-height:0!important;padding:0!important;margin:0!important;background:transparent!important}.direct-module .test-controls,.direct-module .test-size-label,.direct-module .test-bar{display:none!important}
    @media (min-width:1200px) and (max-width:1365px){.dashboard-shell{padding-right:14px;padding-left:14px}.dashboard-grid{grid-template-rows:420px 330px 280px}}@media (min-width:1366px) and (max-width:1599px){.dashboard-grid{grid-template-rows:430px 340px 290px}}
  </style>
</head>
<body>
  <main class="dashboard-shell" aria-label="京津冀教育协同发展监测平台">
    <header class="dashboard-header"><div class="dashboard-header__title"><p class="dashboard-header__eyebrow">BEIJING · TIANJIN · HEBEI EDUCATION COLLABORATION</p><h1>京津冀教育协同发展监测</h1></div><p class="dashboard-header__updated">数据更新日期：<time datetime="2026-08-21">2026-08-21</time></p></header>
    <section class="dashboard-grid" aria-label="协同发展监测板块">
      <section class="dashboard-panel panel-activity-index" aria-label="活跃度指数"><div class="panel-body direct-module"><div id="module-activity-index" class="direct-module__mount"></div></div></section>
      <section class="dashboard-panel panel-activity-share" aria-label="五类协同活跃度占比"><div class="panel-body direct-module"><div id="module-activity-share" class="direct-module__mount"></div></div></section>
      <section class="dashboard-panel panel-important-events" aria-label="重要协同事件"><div class="panel-body direct-module"><div id="module-important-events" class="direct-module__mount"></div></div></section>
      <section class="dashboard-panel panel-education-index" aria-label="教育发展指数"><div class="panel-body direct-module"><div id="module-education-index" class="direct-module__mount"></div></div></section>
      <section class="dashboard-panel panel-cooperation-network" aria-label="协同合作网络"><div class="panel-body direct-module"><div id="module-cooperation-network" class="direct-module__mount"></div></div></section>
      <section class="dashboard-panel panel-coordination-index" aria-label="协同度指数"><div class="panel-body direct-module"><div id="module-coordination-index" class="direct-module__mount"></div></div></section>
      <section class="dashboard-panel panel-stage-share" aria-label="分学段协同事件占比"><div class="panel-body direct-module"><div id="module-stage-share" class="direct-module__mount"></div></div></section>
      <section class="dashboard-panel panel-resource-overview" aria-label="京津冀三地资源分布概览"><a class="panel-more" href="#resource-detail">更多 ›</a><div class="panel-body direct-module"><div id="module-resource-overview" class="direct-module__mount"></div></div></section>
    </section>
  </main>
  <section id="resource-detail-overlay" class="resource-detail-overlay" aria-label="资源分布详情"><div id="module-resource-detail" class="resource-detail-overlay__mount"></div></section>
  <script>window.openResourceDetail=()=>{document.getElementById('resource-detail-overlay').classList.add('is-open');setTimeout(()=>window.__jjjDetail?.resize(),0)};window.closeResourceDetail=()=>document.getElementById('resource-detail-overlay').classList.remove('is-open');document.addEventListener('click',e=>{if(e.target.closest('.panel-more,.resource-overview__more')){e.preventDefault();window.openResourceDetail();}});</script>
  <script src="js/local-module-sources.js"></script>
  <script src="js/direct-module-loader.js"></script>
</body>
</html>
