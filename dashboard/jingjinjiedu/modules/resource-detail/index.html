<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>京津冀三地资源分布概览</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jjj-resource-detail.css?v=6">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #050d26; overflow: hidden; }
    .module-preview {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; background: #050d26;
    }
    .module-preview__frame { width: 1200px; height: 760px; }
  </style>
</head>
<body>
  <main class="module-preview">
    <div class="module-preview__frame">
      <section id="resource-distribution-detail" class="jjj-resource-detail"></section>
    </div>
  </main>

  <script src="data/jjj-resource-detail.mock.js?v=6"></script>
  <script src="data/geo/boundaries-embedded.js"></script>
  <script src="data/geo/jjj-geo-data.js?v=6"></script>
  <script src="jjj-resource-detail.js?v=6"></script>
  <script>
    (function () {
      var container = document.getElementById("resource-distribution-detail");
      if (!container) return;
      var instance = JjjResourceDetail.init(container, mockJjjResourceData, {
        onBack: function () { console.log("[detail] back"); },
        onFilterChange: function (f) { console.log("[detail] filter:", f); }
      });
      window.__jjjDetail = instance;
    })();
  </script>
</body>
</html>
