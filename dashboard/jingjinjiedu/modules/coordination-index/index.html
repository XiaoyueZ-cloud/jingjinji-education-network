<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>协同度指数</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="modules/coordination-index/coordination-index.css">
  <style>
    .coordination-preview { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:#031426; }
    .coordination-preview__frame { width:min(100%, 620px); height:450px; }
    .coordination-preview__frame .dashboard-panel { width:100%; height:100%; }
  </style>
</head>
<body>
  <main class="coordination-preview" aria-label="协同度指数独立预览">
    <div class="coordination-preview__frame">
      <section id="panel-coordination-index" class="dashboard-panel panel-coordination-index">
        <header class="panel-header"><h1 class="panel-title">协同度指数</h1></header>
        <div class="panel-body"><div id="coordination-index-root" class="chart-container"></div></div>
      </section>
    </div>
  </main>
  <script src="assets/echarts.min.js"></script>
  <script src="js/module-loader.js"></script>
  <script src="data/coordination-index-data.js"></script>
  <script src="modules/coordination-index/coordination-index.js"></script>
  <script>
    window.DashboardModules.get('coordination-index').init(
      document.getElementById('coordination-index-root'),
      window.CoordinationIndexData
    );
  </script>
</body>
</html>
